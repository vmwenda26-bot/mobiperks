services:
  - type: web
    name: mobiperks
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: mobiperks-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_FILE
        value: /var/data/data.json
      - key: ADMIN_REVIEW_KEY
        generateValue: true
